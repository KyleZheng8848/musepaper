name: Publish macOS apps

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    name: Build and verify ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            appdir: mac-arm64
          - os: macos-15-intel
            arch: x64
            appdir: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Source version
        id: version
        run: echo "version=$(tr -d '[:space:]' < Packaging/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build installers from this commit
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          ./scripts/check-version-sync.sh
          swift test
          ./scripts/run-localization-smoke.sh
          ARCHS="${{ matrix.arch }}" ./scripts/package-release.sh
      - name: Verify bundle and archives
        run: >-
          python3 scripts/verify-macos-release.py
          --product Musepaper --version "${{ steps.version.outputs.version }}"
          --arch "${{ matrix.arch }}" --repo "https://github.com/${{ github.repository }}"
          --app "dist/Musepaper-${{ matrix.arch }}.app" --stem "release/Musepaper-${{ steps.version.outputs.version }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.arch }}
          path: |
            release/Musepaper-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
            release/Musepaper-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip
            release/${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish the verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < Packaging/VERSION)
          TAG="v$VERSION"
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG")" || { echo 'Tag already exists; refusing to overwrite'; exit 1; }
          cd installers
          cat arm64.sha256 x64.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4
          cat > release-notes.md <<'NOTES'
          Published and maintained by **SofunAI Studio**.

          macOS applications built from the source commit linked to this tag. Choose **arm64** for Apple Silicon or **x64** for Intel. Both DMG and ZIP are provided; verify downloads with `SHA256SUMS.txt`.

          Applications use ad hoc signatures and are **not notarized by Apple**. Mac package verification covers bundle versions, architectures, signatures, privacy exclusions, publisher/source links and archive contents. Interactive app behavior on all hardware is not implied by these packaging checks.

          Open the DMG and run `安装并打开.command` to install and launch.

          由 **SofunAI 工作室**出品并维护。安装包由本标签对应源码构建：M 系列芯片选 **arm64**，Intel 选 **x64**。提供 DMG、ZIP 与 SHA256 校验文件。

          应用采用临时签名，尚未经过 Apple 公证。打开 DMG 后运行「安装并打开.command」安装并启动。
          NOTES
          gh release create "$TAG" ./*.dmg ./*.zip SHA256SUMS.txt --target "$GITHUB_SHA" --draft --title "Musepaper $VERSION" --notes-file release-notes.md
          gh release edit "$TAG" --draft=false --latest
          mkdir public-download
          cd public-download
          # Anonymous downloads exercise the same public URLs used by README.
          while read -r HASH NAME; do
            curl --fail --location --retry 3 --max-time 300 --silent --show-error "https://github.com/$GH_REPO/releases/download/$TAG/$NAME" -o "$NAME"
          done < ../SHA256SUMS.txt
          sha256sum --check ../SHA256SUMS.txt
          gh release view "$TAG" --json url,tagName,isDraft,targetCommitish,assets
